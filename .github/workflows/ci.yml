name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - name: Fixtures match their generator
        run: python tests/fixtures/make_fixtures.py && git diff --exit-code tests/fixtures
      - run: pytest -q
